<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent 連接懶人包・Firebase 測試頁</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1b1f23;
    --muted: #6b7280;
    --accent: #ff8f00;
    --ok: #1a7f37;
    --err: #c0392b;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --card: #161b22;
      --text: #e6edf3;
      --muted: #9aa5b1;
      --border: #2a313c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 0.92rem;
  }
  .row:last-of-type { border-bottom: none; }
  .row b { font-weight: 600; }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #1b1300;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #result {
    margin-top: 16px;
    min-height: 1.4em;
    font-size: 0.95rem;
    word-break: break-word;
    white-space: pre-wrap;
  }
  #result.ok { color: var(--ok); font-weight: 600; }
  #result.err { color: var(--err); font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <h1>Agent 連接懶人包</h1>
    <p class="sub">前端：Firebase Hosting</p>

    <div class="row"><span>Firestore</span><b id="svc-firestore">待測試</b></div>
    <div class="row"><span>Authentication</span><b id="svc-auth">待測試</b></div>

    <button id="test-btn">測試連線</button>
    <div id="result"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      signInAnonymously,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const resultEl = document.getElementById("result");
    const btn = document.getElementById("test-btn");
    const svcAuth = document.getElementById("svc-auth");
    const svcFirestore = document.getElementById("svc-firestore");

    function explain(err) {
      const code = err && err.code ? err.code : "";
      const msg = (err && err.message) || String(err);
      if (code === "permission-denied" || /insufficient permissions/i.test(msg)) {
        return (
          msg +
          "｜權限不足：請確認 Firestore 規則已部署、Auth 登入方式已開通（請 Agent 重做 AGENTS.md 第 6、7 步）。"
        );
      }
      if (/api[- ]?key/i.test(msg)) {
        return (
          msg +
          "｜Firebase 設定值可能還是佔位值：請 Agent 重做 AGENTS.md 第 4 步第 5 點，寫入真實的 firebase-config.js 後重新部署。"
        );
      }
      return msg;
    }

    let app;
    try {
      app = initializeApp(firebaseConfig);
    } catch (err) {
      resultEl.textContent = "❌ 初始化失敗：" + explain(err);
      resultEl.className = "err";
      btn.disabled = true;
    }

    btn.addEventListener("click", async () => {
      if (!app) return;
      btn.disabled = true;
      resultEl.className = "";
      resultEl.textContent = "測試中…";

      try {
        const auth = getAuth(app);
        const db = getFirestore(app);

        const cred = await signInAnonymously(auth);
        svcAuth.textContent = "✅ 已登入（匿名）";

        await addDoc(collection(db, "connect_check"), {
          note: "hello " + new Date().toISOString(),
          uid: cred.user.uid,
          createdAt: serverTimestamp(),
        });

        const snap = await getDocs(collection(db, "connect_check"));
        svcFirestore.textContent = "✅ 讀寫成功";

        resultEl.textContent = `✅ 連線成功（已寫入並讀回第 ${snap.size} 筆）`;
        resultEl.className = "ok";
      } catch (err) {
        resultEl.textContent = "❌ " + explain(err);
        resultEl.className = "err";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
